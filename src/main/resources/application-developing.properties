# O debugging inclui o developing, que carrega depois dele: o banner vem de `trimly.banner`, definido só pelo debugging.
spring.banner.location=classpath:banners/${trimly.banner:developing}.txt

# =========================================================
# Logging
# =========================================================

logging.level.org.trimly.backend.controller=DEBUG
logging.level.org.trimly.backend.model.service=DEBUG

# =========================================================
# Database - H2
# =========================================================

spring.datasource.url=jdbc:h2:mem:trimly

# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# H2 Console
# =========================================================

spring.h2.console.enabled=true
