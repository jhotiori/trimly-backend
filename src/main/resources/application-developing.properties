# O debugging inclui o developing e carrega depois dele, por isso o banner vem de `trimly.banner`, definido só no debugging.
spring.banner.location=classpath:banners/${trimly.banner:developing}.txt

logging.level.org.trimly.backend.controller=DEBUG
logging.level.org.trimly.backend.model.service=DEBUG

spring.datasource.url=jdbc:h2:mem:trimly

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
