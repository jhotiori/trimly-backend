spring.banner.location=classpath:banners/production.txt

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

server.compression.enabled=true
server.shutdown=graceful

# Sem valor padrão: o application.properties tem um segredo de desenvolvimento, e em produção a aplicação
# deve falhar ao iniciar sem JWT_SECRET.
trimly.security.jwt.secret=${JWT_SECRET}
