spring.banner.location=classpath:banners/production.txt

# =========================================================
# Database - PostgreSQL
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# =========================================================
# Server
# =========================================================

server.compression.enabled=true
server.shutdown=graceful

# =========================================================
# Trimly
# =========================================================

# Sem valor padrão: o application.properties traz um segredo de desenvolvimento, e aqui a aplicação
# deve falhar ao iniciar se JWT_SECRET não estiver definido.
trimly.security.jwt.secret=${JWT_SECRET}
