# =========================================================
# Profiles
# =========================================================

spring.profiles.active=develop

# =========================================================
# Logging
# =========================================================

logging.level.org.trimly.backend=INFO

# =========================================================
# Flyway
# =========================================================

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# =========================================================
# Trimly
# =========================================================

trimly.security.jwt.secret=${JWT_SECRET:secret-key-in-case-there-is-no-jwt-secret}
trimly.security.jwt.expiration=3600
