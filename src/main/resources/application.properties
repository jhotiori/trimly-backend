spring.config.import=optional:file:.env[.properties]

spring.application.name=trimly-backend

spring.profiles.active=${SPRING_PROFILES_ACTIVE:developing}
spring.profiles.group.debugging=developing

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

springdoc.default-produces-media-type=application/json

spring.cloud.openfeign.client.config.brasilapi-feriados.connect-timeout=2000
spring.cloud.openfeign.client.config.brasilapi-feriados.read-timeout=3000

trimly.security.jwt.secret=${JWT_SECRET:me-mude-para-algo-que-contenha-no-minimo-32-caracteres}
trimly.security.jwt.issuer=${JWT_ISSUER:trimly-auth-api}
trimly.security.jwt.expiry=${JWT_EXPIRY:28800}
trimly.cors.origin=${CORS_ORIGIN:http://localhost:4200}
